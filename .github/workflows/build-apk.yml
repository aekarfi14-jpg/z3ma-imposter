name: Build Android APK (Z3MA IMPOSTER)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor CLI & Android
        run: |
          npm install @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2 @capacitor/camera@6.0.0
          npx cap init "Z3MA IMPOSTER" "com.z3ma.imposter" --web-dir=dist
          npx cap add android

      - name: Fix Kotlin version conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Camera & Microphone Permissions
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />|' android/app/src/main/AndroidManifest.xml

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Set Z3MA Imposter launcher icon
        run: |
          set -e

          ICON_SOURCE="public/Icon.jpg"

          if [ ! -f "$ICON_SOURCE" ]; then
            echo "ERROR: Launcher icon not found: $ICON_SOURCE"
            exit 1
          fi

          RES="android/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"
          mkdir -p "$RES/drawable-nodpi"
          mkdir -p "$RES/mipmap-anydpi-v26"

          convert "$ICON_SOURCE" \
            -resize 512x512^ \
            -gravity center \
            -extent 512x512 \
            "$RES/drawable-nodpi/ic_launcher_foreground.png"

          cp "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/mipmap-mdpi/ic_launcher.png"

          cp "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/mipmap-hdpi/ic_launcher.png"

          cp "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          cp "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          cp "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i \
            's#android:icon="@[^"]*"#android:icon="@mipmap/ic_launcher"#g' \
            "$MANIFEST"

          sed -i \
            's#android:roundIcon="@[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#g' \
            "$MANIFEST"

          if ! grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"; then
            sed -i \
              's#<application#<application android:icon="@mipmap/ic_launcher"#' \
              "$MANIFEST"
          fi

          if ! grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MANIFEST"; then
            sed -i \
              's#<application#<application android:roundIcon="@mipmap/ic_launcher_round"#' \
              "$MANIFEST"
          fi

          echo "Z3MA Imposter launcher icon configured successfully."

      - name: Build Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z3MA-IMPOSTER-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
