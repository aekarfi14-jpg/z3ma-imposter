name: Build Android APK (Z3MA IMPOSTER)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor CLI & Android
        run: |
          npm install @capacitor/core@6.2.2 @capacitor/cli@6.2.2 @capacitor/android@6.2.2 @capacitor/camera@6.0.0
          npx cap init "Z3MA IMPOSTER" "com.z3ma.imposter" --web-dir=dist
          npx cap add android

      - name: Fix Kotlin version conflict
        run: |
          cat >> android/build.gradle << 'EOF'
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Camera & Microphone Permissions
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />|' android/app/src/main/AndroidManifest.xml

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Set Z3MA Imposter launcher icon
        run: |
          set -e
          ICON_SOURCE="public/Icon.jpg"
          if [ ! -f "$ICON_SOURCE" ]; then
            echo "ERROR: Launcher icon not found: $ICON_SOURCE"
            exit 1
          fi
          RES="android/app/src/main/res"
          echo "Removing all Capacitor generated launcher icons..."
          find "$RES" -type f \( -name "ic_launcher.png" -o -name "ic_launcher_round.png" -o -name "ic_launcher.xml" -o -name "ic_launcher_round.xml" \) -delete
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"
          echo "Creating launcher icon from $ICON_SOURCE..."
          generate_icon() {
            SIZE=$1
            OUT=$2
            convert "$ICON_SOURCE" -resize "${SIZE}x${SIZE}^" -gravity center -extent "${SIZE}x${SIZE}" "$OUT"
          }
          generate_icon 48 "$RES/mipmap-mdpi/ic_launcher.png"
          generate_icon 48 "$RES/mipmap-mdpi/ic_launcher_round.png"
          generate_icon 72 "$RES/mipmap-hdpi/ic_launcher.png"
          generate_icon 72 "$RES/mipmap-hdpi/ic_launcher_round.png"
          generate_icon 96 "$RES/mipmap-xhdpi/ic_launcher.png"
          generate_icon 96 "$RES/mipmap-xhdpi/ic_launcher_round.png"
          generate_icon 144 "$RES/mipmap-xxhdpi/ic_launcher.png"
          generate_icon 144 "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          generate_icon 192 "$RES/mipmap-xxxhdpi/ic_launcher.png"
          generate_icon 192 "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          echo "Launcher icon generation complete."

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: z3ma-imposter-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
